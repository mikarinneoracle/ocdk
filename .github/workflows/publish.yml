# Publish @mikarinneoracle/oci-cdk-code-only-preview to npm using Trusted Publishing (OIDC).
# Runs on every push to code-only-preview and publishes the current package version.
#
# One-time npm setup (fixes 404 / "token expired" if not done):
#   1. npmjs.com → your org @mikarinneoracle → Packages → create/link oci-cdk-code-only-preview, set Access: Public
#   2. Package page → Automation → Trusted publishers → Add GitHub Actions
#      Repository: mikarinneoracle/ocdk
#      Workflow file: .github/workflows/publish.yml
#      Ref (branch): code-only-preview
#   https://docs.npmjs.com/trusted-publishers

name: Publish to npm

on:
  push:
    branches:
      - code-only-preview

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Clear deprecated npm config
        run: npm config delete always-auth 2>/dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Set version_bumped flag
        id: version_flag
        run: |
          bumped=false
          # Push: treat a change to package.json in the latest commit as a manual version bump trigger
          if [ "${{ github.event_name }}" = "push" ] && git diff --name-only HEAD~1..HEAD | grep -q '^package.json$'; then
            bumped=true
          fi
          echo "version_bumped=${bumped}" >> $GITHUB_OUTPUT

      - name: Verify npm for Trusted Publishing
        if: steps.version_flag.outputs.version_bumped == 'true'
        run: |
          npx -y npm@11.5.1 --version

      - name: Publish to npm
        if: steps.version_flag.outputs.version_bumped == 'true'
        run: npx -y npm@11.5.1 publish --provenance --access public
